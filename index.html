<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMDA医療機器回収情報 統合CSV（メンテナンス中）</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f8fa;
    --card-bg: #ffffff;
    --border: #dfe3e8;
    --text: #1f2937;
    --text-sub: #5f6b7a;
    --warn: #b45309;
    --warn-bg: #fdf1e2;
    --warn-border: #f0c68a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    line-height: 1.8;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 32px 24px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 32px 28px;
    text-align: center;
  }
  .icon { font-size: 40px; margin-bottom: 12px; }
  h1 {
    font-size: 19px;
    margin: 0 0 16px;
  }
  .notice {
    margin: 0 0 20px;
    padding: 14px 16px;
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: 6px;
    font-size: 13.5px;
    color: var(--warn);
    text-align: left;
    line-height: 1.9;
  }
  .notice strong { display: block; margin-bottom: 4px; }
  p.desc {
    font-size: 13.5px;
    color: var(--text-sub);
    text-align: left;
    margin: 0 0 12px;
  }
  .meta-line {
    font-size: 12px;
    color: var(--text-sub);
    margin-top: 20px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="icon">🔧</div>
    <h1>PMDA医療機器回収情報 統合CSV</h1>
    <div class="notice">
      <strong>現在、本サイトは一時的に閉鎖しています。</strong>
      サイバー攻撃に対する予防的な措置として、メンテナンスのため公開を停止しています。
      CSVのダウンロード機能は現在ご利用いただけません。
    </div>
    <p class="desc">
      本件に関するご不便をお詫びいたします。再開時期は未定です。
      PMDA公式の回収情報は、下記の公式サイトから直接ご確認いただけます。
    </p>
    <p class="desc">
      <a href="https://www.pmda.go.jp/safety/recalls-fsc/0002.html" target="_blank" rel="noopener">PMDA 医療機器の回収一覧（公式）</a>
    </p>
    <p class="meta-line">2026年10月25日 更新</p>
  </div>
</div>
</body>
</html>
