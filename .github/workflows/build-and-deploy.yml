name: Build recall CSV and deploy to Pages

on:
  schedule:
    # 毎日 JST 05:10 (UTC 20:10、前日分) に実行。
    # GitHub Actionsの定時実行はきっかり0分・0時台に集中すると混雑により
    # 数十分〜数時間遅延することがあるため、キリの良い時刻を避けつつ、
    # 実測の最大遅延（約2時間48分）を踏まえて09:00の利用開始までに
    # 確実に完了するよう余裕を持たせている。
    - cron: "10 20 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          # ランナーのキャッシュに頼らず、毎回Node.js公式の最新パッチ版を確認してから
          # インストールする（セキュリティ修正版への追従を早めるため）。
          check-latest: true

      - name: PMDAから最新データを取得しCSVを生成（内部データは継続更新）
        run: node build.js

      - name: 履歴データ（回収済み検出用）をリポジトリにコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "履歴に変更なし"
          else
            git commit -m "Update recall history [skip ci]"
            git push
          fi

      - name: 公開用ディレクトリを構成
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/recall_list_merged.csv _site/data/recall_list_merged.csv
          cp data/recall_list_cumulative.csv _site/data/recall_list_cumulative.csv
          cp data/meta.js _site/data/meta.js
          cp data/build-log.json _site/data/build-log.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
