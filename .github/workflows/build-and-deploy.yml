name: Build recall CSV and deploy to Pages

# 【2026-10-25 サイト一時閉鎖中】
# サイバー攻撃への予防的措置として、公開ページをメンテナンス通知のみにしています。
# それに伴い、毎日の自動実行（schedule）は一時停止中です。再開する場合は、
# 下記 schedule セクションのコメントを解除し、「公開用ディレクトリを構成」ステップで
# data/ 以下のファイルを再度 _site/data にコピーするよう戻してください。
on:
  # schedule:
  #   # 毎日 09:00 JST (00:00 UTC) に実行
  #   - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          # ランナーのキャッシュに頼らず、毎回Node.js公式の最新パッチ版を確認してから
          # インストールする（セキュリティ修正版への追従を早めるため）。
          check-latest: true

      - name: PMDAから最新データを取得しCSVを生成（内部データは継続更新）
        run: node build.js

      - name: 履歴データ（回収済み検出用）をリポジトリにコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "履歴に変更なし"
          else
            git commit -m "Update recall history [skip ci]"
            git push
          fi

      - name: 公開用ディレクトリを構成（閉鎖中はメンテナンス通知のみ公開・CSVは非公開）
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
